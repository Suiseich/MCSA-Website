<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MCSA - Contact</title>
    <link rel="icon" type="image/x-icon" href="assets/img/MCSA Logo 2024-2025.png">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap CSS -->
    <link href="css/styles.css" rel="stylesheet" />
    <link rel="stylesheet" href="css/custom.css">
    <!-- Font Awesome -->
    <script src="https://use.fontawesome.com/releases/v6.3.0/js/all.js" crossorigin="anonymous"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css?family=Montserrat:400,700" rel="stylesheet" type="text/css" />
    <link href="https://fonts.googleapis.com/css?family=Roboto+Slab:400,100,300,700" rel="stylesheet" type="text/css" />
    <!-- EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script>
        (function() {
            emailjs.init("3f9hF6d_1I7o_cSKj"); //  EmailJS public key
        })();
    </script>
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark fixed-top" id="mainNav">
        <div class="container">
            <a class="navbar-brand" href="index.html"><img src="assets/img/MCSA Logo 2024-2025.png" alt="..." /></a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarResponsive" aria-controls="navbarResponsive" aria-expanded="false" aria-label="Toggle navigation">
                Menu <i class="fas fa-bars ms-1"></i>
            </button>
            <div class="collapse navbar-collapse" id="navbarResponsive">
                <ul class="navbar-nav text-uppercase ms-auto py-4 py-lg-0">
                    <li class="nav-item"><a class="nav-link" href="about.html">About Us</a></li>
                    <li class="nav-item"><a class="nav-link" href="events.html">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="projects.html">Projects</a></li>
                    <li class="nav-item"><a class="nav-link" href="gallery.html">Gallery</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <button onclick="topFunction()" id="myBtn" title="Go to top"><img src="assets/arrow-up.png" alt="" width="20px"></button>

    <!-- Contact Form -->
    <div class="main-content">
        <div class="contactbg"></div>
        <section class="page-section" id="contact">
            <div class="container">
                <div class="text-center">
                    <h2 class="section-heading text-uppercase">Contact Us</h2>
                    <h3 class="section-subheading text-muted">Any inquiries? Send us a message and we’ll get back to you.</h3>
                </div>
                <form id="contactForm">
                    <div class="row align-items-stretch mb-5">
                        <div class="col-md-6">
                            <div class="form-group">
                                <input class="form-control" id="name" name="name" type="text" placeholder="Your Name *" required>
                            </div>
                            <div class="form-group">
                                <input class="form-control" id="email" name="email" type="email" placeholder="Your Email *" required>
                            </div>
                            <div class="form-group mb-md-0">
                                <input class="form-control" id="phone" name="phone" type="tel" placeholder="Your Phone *" required>
                            </div>
                        </div>
                        <div class="col-md-6">
                            <div class="form-group form-group-textarea mb-md-0">
                                <textarea class="form-control" id="message" name="message" placeholder="Your Message *" required></textarea>
                            </div>
                        </div>
                    </div>
                    <div class="text-center">
                        <button class="btn btn-primary btn-xl text-uppercase" id="submitButton" type="submit">Send Message</button>
                    </div>
                </form>
                <p id="response-message" class="mt-3 text-center"></p>
                <h3 class="section-subheading text-muted" id="fblinkc">Visit our official Facebook page <a href="https://www.facebook.com/UAmcsaofficial" aria-label="Facebook" target="_blank">here</a>.</h3>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="footer py-4">
        <div class="container">
            <div class="row align-items-center">
                <div class="col-lg-4 text-lg-start d-flex align-items-center">
                    <a class="btn btn-dark btn-social mx-2" href="https://www.facebook.com/UAmcsaofficial" aria-label="Facebook" target="_blank">
                        <i class="fab fa-facebook-f"></i>
                    </a>
                    <p class="text-muted mb-0">Website by Group 4 in cooperation with MCSA</p>
                </div>
                <div class="col-lg-8 text-lg-end">
                    <img src="assets/img/MCSA Logo 2024-2025.png" alt="Logo 1" style="height: 60px;">
                    <img src="assets/img/SAS.png" alt="Logo 2" style="height: 60px;">
                    <img src="assets/img/AB Comm Logo (Improved).png" alt="Logo 3" style="height: 60px;">
                    <img src="assets/img/UA-Logo.png" alt="" style="height: 60px;">
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap core JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Core theme JS -->
    <script src="js/scripts.js"></script>

    <!-- EmailJS Form Submission Script -->
    <script>
        (function() {
            emailjs.init("3f9hF6d_1I7o_cSKj"); // public key
        })();
    
        document.getElementById("contactForm").addEventListener("submit", function(event) {
            event.preventDefault();
    
            emailjs.sendForm("service_8nzwpzu", "template_gnojn3q", this) // service id & template id
                .then(function(response) {
                    console.log("SUCCESS!", response);
                    document.getElementById("response-message").textContent = "Message sent successfully!";
                    document.getElementById("response-message").classList.add("text-success");
                    document.getElementById("contactForm").reset();
                }, function(error) {
                    console.error("EmailJS Error:", error);
                    document.getElementById("response-message").textContent = "Error sending message. Try again.";
                    document.getElementById("response-message").classList.add("text-danger");
                });
        });
    </script>
</body>
</html>
